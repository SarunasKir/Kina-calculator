name: Package

# Builds the Android APK and the Windows installer. CI runs it on every change;
# the release workflow runs it for a version tag.
on:
  workflow_call:
    inputs:
      version:
        description: Version such as 1.2.3 or v1.2.3. Empty uses pubspec.yaml.
        type: string
        default: ''
    secrets:
      KINA_KEYSTORE_BASE64:
        required: false
      KINA_KEYSTORE_PASSWORD:
        required: false
      KINA_KEY_ALIAS:
        required: false
      KINA_KEY_PASSWORD:
        required: false

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            v="$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "number=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KINA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KINA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KINA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KINA_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/kina.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          else
            echo "::warning::No release key in the repository secrets; signing with a throwaway key. This APK cannot update an app installed from a release."
            KEYSTORE_PASSWORD="throwaway-$RANDOM$RANDOM"
            KEY_ALIAS=kina
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=Kina Calculator CI"
          fi
          {
            echo "KINA_KEYSTORE_PATH=$keystore"
            echo "KINA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KINA_KEY_ALIAS=$KEY_ALIAS"
            echo "KINA_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
      - name: Build
        working-directory: app
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
      - name: Check the signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kina-calculator-android
          path: app/build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Build Windows app
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            v="$(grep '^version:' app/pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "number=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"
      - name: Build
        working-directory: app
        run: >
          flutter build windows --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ steps.version.outputs.number }}
      - name: Bundle the Visual C++ runtime
        # Lets the app start on a PC that has never installed it.
        run: |
          release=app/build/windows/x64/runner/Release
          for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$dll" "$release/"
          done
      - name: Build the installer
        run: |
          choco install innosetup -y --no-progress
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "//DAppVersion=${{ steps.version.outputs.name }}" \
            "//DSourceDir=$(cygpath -w "$PWD/app/build/windows/x64/runner/Release")" \
            installer/kina_calculator.iss
      - name: Zip the portable app
        run: |
          powershell -Command "Compress-Archive -Path 'app/build/windows/x64/runner/Release/*' -DestinationPath 'dist/KinaCalculator-${{ steps.version.outputs.name }}-windows-portable.zip'"
      - uses: actions/upload-artifact@v4
        with:
          name: kina-calculator-windows
          path: dist/
